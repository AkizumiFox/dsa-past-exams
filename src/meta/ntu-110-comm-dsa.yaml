instructions: '※ 注意：請用 2B 鉛筆作答於答案卡，並先詳閱答案卡上之「畫記說明」。 In this exam, the height of a leaf (in either a tree or heap) is defined as 0; the depth of the root (in either a tree or heap) is defined as 0; the degree of a node (in either a tree or heap) is defined as the number of its children; the size of a tree/heap is defined as the total number of keys (items) it stores; all heaps, unless otherwise specified, are min heaps. 一、(20%) 是非題，正確請選 A，錯誤請選 B（每題 2 分，答錯每題倒扣 1 分至本大題 0 分止）。 二、(50%) 選擇題（每題 2 分，答錯不倒扣）。 三、(30%) 複選題（每題 2.5 分，每答錯一個選項倒扣 0.5 分至該題 0 分止）。'
