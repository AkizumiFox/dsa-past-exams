subject: 資料結構（B）
instructions: '答案請務必填在電腦閱卷之「答案卡」上。(一) 是非題 (共 10 小題，若你覺得該小題命題正確，請填 (A)，錯誤，請填 (B)。每題答對得 4 分，答錯倒扣 4 分，未填答者不計分也不扣分，倒扣至是非題總分為 0 分為止) (二) 複選題 (共六小題，每題 10 分, 題內每個選項單獨計分，答對得 2 分，答錯倒扣 2 分，倒扣至複選題總分為 0 分為止。如某題未作答則該題得 0 分，不到扣。) (例：正確答案為 ABC，若答 BCD，則答對三個選項(BCE)，答錯兩個選項(AD)，故共計得 3*2 - 2*2 = 2 分)'
