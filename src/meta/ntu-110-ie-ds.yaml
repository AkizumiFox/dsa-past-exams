instructions: "※ 注意：請用 2B 鉛筆作答於答案卡，並先詳閱答案卡上之「畫記說明」。 In this exam, the height of a leaf (in either a tree or heap) is defined as 0. The depth of the root (in either a tree or heap) is defined as 0. The degree of a node (in either a tree or heap) is defined as the number of its children. The size of a tree/heap is defined as the total number of keys (items) it stores. Unless otherwise specified, n denotes the size of the data structure. All heaps, unless otherwise specified, are min heaps. 一、(30%)單選題（每題 3 分，答錯不倒扣）：Please choose the best possible answer in each of the following questions. In questions that ask for time complexities, please choose the tightest bound. 二、(70%)複選題（每題 5 分，每答錯一個選項倒扣 1 分至該題 0 分止）。"
