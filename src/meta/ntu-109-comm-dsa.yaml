instructions: >-
  In this exam: The height of a singleton tree is defined as 0. The order of a node in a tree is
  defined as the number of its children. The order of a tree is defined as the maximum order among
  its nodes. Unless otherwise specified, all logarithms are taken with respect to base 2, i.e.,
  $\log_2$. 一、(20\%)是非題（每題 2 分，答錯每題倒扣 1 分至本大題 0 分止）。 二、(64\%)單選題（每題
  2 分，答錯不倒扣） Please choose the best possible answer in each of the following questions. In
  questions that ask for time complexities, please choose the tightest bound. 三、(16\%)複選題（每題
  2 分，每答錯一個選項倒扣 0.4 分至該題 0 分止）。
