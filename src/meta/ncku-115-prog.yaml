instructions: 不可使用計算機。 請於答案卷(卡)作答，於試題上作答，不予計分。 Part I. 資料結構 (50\%)，共 15 題：一、問答題 (14 分)，答案依題號 (1, 2, 3, 4) 依序作答於答案卷；二、單選題 (24 分，每題 3 分)，劃記於答案卡，共有題組 A 和題組 B，每題組包含 4 小題，每小題答對得 3 分，答錯倒扣 1 分；三、複選題 (12 分，每題 4 分)，劃記於答案卡，每題答對得 4 分。 Part II. 演算法 (50\%)，共 9 題：一、是非題 (10 分，每題 2 分，答錯倒扣 1 分)，劃記於答案卡；二、問答題 (40 分)，作答於答案卷，並請註明該答案所對應之題號 (例：1-1、1-3.2)。
